<!DOCTYPE html>
<!--
  The host page for every widget iframe.

  RemNote loads one URL per widget, `index.html?widgetName=<name>`, and this
  picks the matching bundle. Each widget is built twice, plain and `-sandbox`,
  and this page always loads the sandbox copy.

  Written as a real file rather than generated by HtmlWebpackPlugin, which
  silently dropped the DOCTYPE below and left every widget rendering in quirks
  mode. Quirks mode changes the box model and table layout out from under the
  stylesheet, and the only clue is one console line.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Laps</title>
  </head>
  <body>
    <script type="text/javascript">
      const urlSearchParams = new URLSearchParams(window.location.search);
      const queryParams = Object.fromEntries(urlSearchParams.entries());
      const widgetName = queryParams['widgetName'];
      if (widgetName == undefined) {
        document.body.innerHTML += 'Widget ID not specified.';
      }

      const s = document.createElement('script');
      s.type = 'module';
      s.src = widgetName + '-sandbox.js';
      document.body.appendChild(s);
    </script>
  </body>
</html>
